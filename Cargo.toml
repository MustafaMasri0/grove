[workspace]
resolver = "2"
members = ["crates/wv-core", "crates/wv-helper", "src-tauri"]
# The Tauri app needs each OS's webview libraries; plain `cargo test` covers the shared crates anywhere.
default-members = ["crates/wv-core", "crates/wv-helper"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2"
base64 = "0.22"
wv-core = { path = "crates/wv-core" }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
